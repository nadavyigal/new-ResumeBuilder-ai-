name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Single source of truth for the quarantine. Fixed a suite? Delete it from
      # this one line. Listing it twice is how a suite gets fixed in one place and
      # silently stays excluded in the other.
      #
      # Unquoted $KNOWN_RED below relies on shell word-splitting, which is correct
      # under bash (the default shell for `run:` on ubuntu runners) and gives
      # 15 gating / 4 quarantined. It does NOT split under zsh, so reproducing
      # these steps on a Mac needs `bash -c` or the list spelled out.
      KNOWN_RED: >-
        tests/contracts/expert-workflow-report-store.test.ts
        tests/contracts/seo-routing.test.ts
        tests/contracts/diff-safety.test.ts
        tests/contracts/agent-result-schema.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

      # WHY THIS IS SPLIT (2026-08-28):
      # Both steps here used to end in `|| true`, so neither could fail the build
      # and a green check on this repo meant nothing. Removing `|| true` outright
      # is not possible yet: 4 contract suites are red on `main` itself, verified
      # by running them at origin/main with no local changes. Gating on them today
      # would red-line every PR for reasons no PR caused.
      #
      # So the suite is split. Everything that passes today is now GATING, and the
      # 4 known-red suites are quarantined by name where they stay visible instead
      # of being swallowed. Shrink the ignore list; do not grow it.
      - name: Contract tests (gating)
        run: npx jest tests/contracts --testPathIgnorePatterns $KNOWN_RED

      # Known red on main. Tracked, not gating. Two distinct causes:
      #   - seo-routing / diff-safety / agent-result-schema: "Cannot use import
      #     statement outside a module" from src/lib/export.ts:35. A jest ESM
      #     transform config gap, not a product defect.
      #   - expert-workflow-report-store: 5 genuinely failing assertions.
      # continue-on-error, not `|| true`: the step still reports red in the UI.
      - name: Contract tests (known red, not gating)
        continue-on-error: true
        run: npx jest $KNOWN_RED

      # Has never once run: it imports src/lib/agent/index.js, which does not
      # exist (the source is TypeScript), so it dies with ERR_MODULE_NOT_FOUND
      # before benchmarking anything. Kept visible rather than silently green.
      - name: Benchmark (CI) — known broken, not gating
        continue-on-error: true
        run: node scripts/bench-agent.mjs --ci

  e2e:
    name: Activation path E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # Gating. The spec intercepts /api/public/ats-check, so no Supabase or
      # OpenAI credential is reached and the result is deterministic.
      - name: Run activation-path E2E
        run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
