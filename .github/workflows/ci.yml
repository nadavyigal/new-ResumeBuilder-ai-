name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

      # The whole jest suite gates (2026-10-06). It used to run only tests/contracts
      # with 4 suites quarantined, while 18 suites / 77 tests were red on main.
      # Suites that need paid or shared systems (OpenAI, the real Supabase project,
      # a running server) are skipped unless RUN_LIVE_AI_TESTS / RUN_LIVE_BACKEND_TESTS
      # is set (tests/helpers/live-gates.ts), so this step needs no secrets.
      - name: Jest (gating)
        run: npx jest --ci

      # Has never once run: it imports src/lib/agent/index.js, which does not
      # exist (the source is TypeScript), so it dies with ERR_MODULE_NOT_FOUND
      # before benchmarking anything. Kept visible rather than silently green.
      - name: Benchmark (CI) — known broken, not gating
        continue-on-error: true
        run: node scripts/bench-agent.mjs --ci

  e2e:
    name: Activation path E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      # Gating. The spec intercepts /api/public/ats-check, so no Supabase or
      # OpenAI credential is reached and the result is deterministic.
      - name: Run activation-path E2E
        run: npx playwright test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
